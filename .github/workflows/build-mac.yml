name: Build macOS package

# Manuell + bei Aenderungen an mac-relevanten Pfaden - baut auf einem echten
# macOS-Runner (kostenlose Actions-Minuten, kein eigener Mac noetig), weil
# electron-builder Mac-Targets NUR von macOS aus bauen kann (getestet, siehe
# Riffs Projekt-Memory: "electron-builder --mac" von Windows aus verweigert
# sich hart). Kompiliert zuerst den nativen Swift-Helper (RiffHelperMac.swift,
# Ersatz fuer RiffHelper.ps1 auf Mac), dann electron-builder --mac.
# App-Quellcode liegt unter app/ (2026-08: riff-app-Repo hier reingemergt,
# ein Repo statt zwei - siehe Riffs Projekt-Memory).
#
# WICHTIG: ein gruener Lauf hier beweist NUR "kompiliert + paketiert sauber",
# NICHT "Diktieren funktioniert auf echtem Mac" - Tastatur-Injection und
# Bedienungshilfen-Berechtigung lassen sich in CI (kein echter Login-Session-
# Kontext, kein Mensch der die Berechtigung erteilt) nicht pruefen.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "app/helper/RiffHelperMac.swift"
      - "app/src/**"
      - "app/package.json"
      - ".github/workflows/build-mac.yml"

jobs:
  build-mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compile native macOS helper (Swift, universal x64+arm64)
        # Ein Mac-Nutzer meldete ein arm64-only Helper-Binary auf einem Intel-
        # Mac (Bug: App im Finder da, aber ausgegraut mit X - exec format
        # error laesst sich vermuten). electron-builder baut die App selbst
        # bereits universal (siehe package.json mac.target), der Helper muss
        # das jetzt auch sein, sonst schlaegt spawn() auf Intel weiterhin fehl.
        run: |
          swiftc -target x86_64-apple-macos11 helper/RiffHelperMac.swift -o helper/RiffHelperMac-x64
          swiftc -target arm64-apple-macos11 helper/RiffHelperMac.swift -o helper/RiffHelperMac-arm64
          lipo -create helper/RiffHelperMac-x64 helper/RiffHelperMac-arm64 -output helper/RiffHelperMac
          rm helper/RiffHelperMac-x64 helper/RiffHelperMac-arm64
          chmod +x helper/RiffHelperMac
          lipo -info helper/RiffHelperMac

      - name: Install dependencies
        run: npm ci

      - name: Build unsigned macOS package
        run: npx electron-builder --mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # kein Zertifikat vorhanden, gar nicht erst danach suchen

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: riff-mac-unsigned
          path: app/dist/*.zip
          retention-days: 14
